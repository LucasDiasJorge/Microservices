server:
  port: 8761

spring:
  application:
    name: eureka-service
  # Config Server é opcional: sem ele, os defaults abaixo bastam para subir local.
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
