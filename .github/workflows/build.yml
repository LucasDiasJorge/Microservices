name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  maven:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build do reactor
        run: mvn -B --no-transfer-progress clean install

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: maven
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Garante que todos os stages de runtime do Dockerfile continuam construindo.
      - name: Build das imagens
        run: |
          for target in eureka config-server gateway oauth producer workers payroll; do
            echo "::group::$target"
            docker build --target "$target" -t "microservices/$target:ci" .
            echo "::endgroup::"
          done

      - name: Validar docker-compose
        run: docker compose config --quiet
