# Stack completa. Sobe tudo com:  docker compose up --build
name: microservices

services:

  # ----------------------------------------------------------------- infra --
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      # A config antiga usava DB_VENDOR/DB_ADDR, variáveis do Keycloak legado que
      # as versões Quarkus ignoram — o Keycloak subia com banco em memória e
      # perdia tudo a cada restart. Estas são as variáveis atuais.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixa o issuer no endereço público. Sem isto, o token emitido para um
      # cliente interno viria com issuer http://keycloak:8080 e seria rejeitado.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-import.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    environment:
      # KRaft: o Zookeeper foi removido no Kafka 4.x.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "7777:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------- serviços --
  eureka:
    build: {context: ., dockerfile: Dockerfile, target: eureka}
    environment:
      CONFIG_SERVER_URI: http://config-server:8888
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  config-server:
    build: {context: ., dockerfile: Dockerfile, target: config-server}
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  gateway:
    build: {context: ., dockerfile: Dockerfile, target: gateway}
    environment:
      EUREKA_URI: http://eureka:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/my-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/my-realm/protocol/openid-connect/certs
    ports:
      - "9090:9090"
    depends_on:
      eureka:
        condition: service_healthy
    restart: unless-stopped

  oauth:
    build: {context: ., dockerfile: Dockerfile, target: oauth}
    environment:
      EUREKA_URI: http://eureka:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/my-realm
      KEYCLOAK_REALM: my-realm
      KEYCLOAK_CLIENT_ID: my-client
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-local-secret-not-for-production}
    ports:
      - "4321:4321"
    depends_on:
      eureka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped

  workers:
    build: {context: ., dockerfile: Dockerfile, target: workers}
    environment:
      EUREKA_URI: http://eureka:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
    depends_on:
      eureka:
        condition: service_healthy
    restart: unless-stopped

  payroll:
    build: {context: ., dockerfile: Dockerfile, target: payroll}
    environment:
      EUREKA_URI: http://eureka:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
    ports:
      - "8452:8452"
    depends_on:
      eureka:
        condition: service_healthy
    restart: unless-stopped

  producer:
    build: {context: ., dockerfile: Dockerfile, target: producer}
    environment:
      EUREKA_URI: http://eureka:8761/eureka/
      CONFIG_SERVER_URI: http://config-server:8888
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      eureka:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
